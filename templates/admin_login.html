{% extends 'base.html' %}

{% block title %}เข้าสู่ระบบผู้ดูแล - คนนอนนาตรวจหวย{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-12">
    <div class="max-w-sm w-full bg-[#123626]/95 rounded-3xl p-8 border border-emerald-500/30 shadow-2xl shadow-emerald-950/70 backdrop-blur-md">

        <!-- Header -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-emerald-600 to-green-600 text-white flex items-center justify-center mx-auto mb-3 shadow-lg shadow-emerald-500/30 border border-emerald-400/30">
                <i class="fa-solid fa-lock text-xl text-amber-300"></i>
            </div>
            <h1 class="text-2xl font-bold font-heading text-white">ผู้ดูแลระบบ</h1>
            <p class="text-xs text-emerald-200/80 mt-1">คนนอนนาตรวจหวย (Admin Console)</p>
        </div>

        <form method="POST" action="{{ url_for('admin_login') }}" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div>
                <label for="username" class="block text-xs font-semibold text-emerald-200 mb-1">
                    ชื่อผู้ใช้งาน
                </label>
                <div class="relative">
                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="w-full bg-[#0a1f15] border-2 border-emerald-700/60 text-white rounded-xl px-4 py-3 text-sm focus:ring-4 focus:ring-amber-400/20 focus:border-amber-400 focus:outline-none transition shadow-inner"
                        placeholder="admin"
                        required
                        autocomplete="username"
                    >
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-emerald-200 mb-1">
                    รหัสผ่าน
                </label>
                <div class="relative">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="w-full bg-[#0a1f15] border-2 border-emerald-700/60 text-white rounded-xl px-4 py-3 text-sm focus:ring-4 focus:ring-amber-400/20 focus:border-amber-400 focus:outline-none transition shadow-inner"
                        placeholder="••••••••••••"
                        required
                        autocomplete="current-password"
                    >
                </div>
            </div>

            <button
                type="submit"
                class="w-full py-3 bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-300 hover:to-amber-400 text-slate-950 font-black text-sm font-heading rounded-xl transition active:scale-95 flex items-center justify-center gap-2 mt-2 shadow-lg shadow-amber-500/20"
            >
                <span>เข้าสู่ระบบ</span>
            </button>
        </form>

        <div class="mt-6 pt-5 border-t border-emerald-900/60 text-center">
            <span class="inline-flex items-center gap-1.5 text-[11px] text-emerald-400 font-medium">
                <i class="fa-solid fa-shield-check"></i>
                <span>Brute-force Protected (ล็อก 15 นาทีเมื่อใส่ผิด 5 ครั้ง)</span>
            </span>
            <p class="text-[11px] text-emerald-300/70 mt-2">
                รหัสเริ่มต้น: <code class="bg-[#0a1f15] border border-emerald-900 text-amber-300 px-2 py-0.5 rounded font-mono">Admin@Lottery#2026</code>
            </p>
        </div>

    </div>
</div>
{% endblock %}
